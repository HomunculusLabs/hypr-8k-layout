# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Wallpaper management
exec-once = hyprpaper

# Status bar
exec-once = waybar

# Blue light filter for Houlton, Maine
exec-once = uwsm app -- hyprsunset

# Center-stage layout handler for workspaces 1-3
# Handler is now managed by systemd: centerstage-handler.service

# Restore the named workspace 1 session (the script restarts the handler)
exec-once = ~/.config/hypr/scripts/centerstage-session-startup.sh
