# Application bindings
bind = SUPER SHIFT, F, exec, uwsm-app -- nautilus --new-window
bind = SUPER SHIFT, B, exec, omarchy-launch-browser
bind = SUPER SHIFT ALT, B, exec, omarchy-launch-browser --private
bind = SUPER SHIFT, M, exec, omarchy-launch-or-focus spotify
bind = SUPER SHIFT, N, exec, omarchy-launch-editor
bind = SUPER SHIFT, T, exec, omarchy-launch-tui btop
bind = SUPER SHIFT, D, exec, omarchy-launch-tui lazydocker
bind = SUPER SHIFT, G, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bind = SUPER SHIFT, O, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bind = SUPER SHIFT, W, exec, uwsm-app -- typora --enable-wayland-ime
bind = SUPER SHIFT, SLASH, exec, uwsm-app -- 1password
bind = SUPER SHIFT, C, exec, codex-desktop

# Monitor movement disabled - single monitor setup
# bind = SUPER ALT, LEFT, Move window to left monitor, exec, hyprctl dispatch movewindow mon:HDMI-A-1
# bind = SUPER ALT, RIGHT, Move window to right monitor, exec, hyprctl dispatch movewindow mon:DP-2
# bind = SUPER ALT, 1, Move window to monitor 1, exec, hyprctl dispatch movewindow mon:DP-2
# bind = SUPER ALT, 2, Move window to monitor 2, exec, hyprctl dispatch movewindow mon:HDMI-A-1

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
bind = SUPER, SPACE, exec, ~/.local/share/omarchy/bin/omarchy-launch-walker

# Center-Stage Layout (workspaces 1-3)
# Moves windows to fixed zones on ultrawide: Left | Center | Right
bind = SUPER CTRL, bracketleft, exec, ~/.config/hypr/scripts/centerstage-move.sh left
bind = SUPER CTRL, bracketright, exec, ~/.config/hypr/scripts/centerstage-move.sh right
bind = SUPER CTRL, backslash, exec, ~/.config/hypr/scripts/centerstage-move.sh center
bind = SUPER CTRL, SEMICOLON, exec, ~/.config/hypr/scripts/centerstage-toggle.sh
bind = SUPER CTRL, RETURN, exec, ~/.config/hypr/scripts/centerstage-add.sh center
bind = SUPER ALT, PERIOD, exec, ~/.config/hypr/scripts/centerstage-resize.sh
bind = SUPER ALT, COMMA, exec, ~/.config/hypr/scripts/centerstage-height.sh
bind = SUPER CTRL, APOSTROPHE, exec, ~/.config/hypr/scripts/centerstage-sidebar.sh
bind = SUPER CTRL, UP, exec, ~/.config/hypr/scripts/centerstage-swap.sh up
bind = SUPER CTRL, DOWN, exec, ~/.config/hypr/scripts/centerstage-swap.sh down
bind = SUPER SHIFT, LEFT, exec, ~/.config/hypr/scripts/centerstage-swap.sh left
bind = SUPER SHIFT, RIGHT, exec, ~/.config/hypr/scripts/centerstage-swap.sh right
bind = SUPER CTRL, S, exec, ~/.config/hypr/scripts/centerstage-save.sh
bind = SUPER CTRL, SLASH, exec, ~/.config/hypr/scripts/centerstage-shrink-toggle.sh
bind = SUPER CTRL SHIFT, bracketleft, exec, ~/.config/hypr/scripts/centerstage-left-layout.sh
bind = SUPER CTRL ALT, bracketright, exec, ~/.config/hypr/scripts/centerstage-left-ratio.sh increase
bind = SUPER CTRL ALT, bracketleft, exec, ~/.config/hypr/scripts/centerstage-left-ratio.sh decrease
bind = SUPER CTRL ALT, SEMICOLON, exec, ~/.config/hypr/scripts/centerstage-swap-primary-center.sh
bind = SUPER CTRL ALT, period, exec, ~/.config/hypr/scripts/centerstage-obsidian-gap.sh decrease
bind = SUPER CTRL ALT, comma, exec, ~/.config/hypr/scripts/centerstage-obsidian-gap.sh increase
bind = ALT SHIFT, S, exec, ~/.config/hypr/layouts/centerstage/centerstage-swap-obsidian-brave.sh
bind = ALT SHIFT, E, exec, ~/.config/hypr/layouts/centerstage/centerstage-left-expand.sh
bind = ALT SHIFT, F, exec, omarchy-cmd-screenshot smart clipboard

# Right sidebar position focus (ALT+SHIFT+0-9)
bind = ALT SHIFT, 0, exec, ~/.config/hypr/scripts/centerstage-focus.sh 0
bind = ALT SHIFT, G, exec, ~/.config/hypr/scripts/centerstage-focus.sh 0
bind = ALT SHIFT, 1, exec, ~/.config/hypr/scripts/centerstage-focus.sh 1
bind = ALT SHIFT, 2, exec, ~/.config/hypr/scripts/centerstage-focus.sh 2
bind = ALT SHIFT, 3, exec, ~/.config/hypr/scripts/centerstage-focus.sh 3
bind = ALT SHIFT, 4, exec, ~/.config/hypr/scripts/centerstage-focus.sh 4
bind = ALT SHIFT, 5, exec, ~/.config/hypr/scripts/centerstage-focus.sh 5
bind = ALT SHIFT, 6, exec, ~/.config/hypr/scripts/centerstage-focus.sh 6
bind = ALT SHIFT, 7, exec, ~/.config/hypr/scripts/centerstage-focus.sh 7
bind = ALT SHIFT, 8, exec, ~/.config/hypr/scripts/centerstage-focus.sh 8
bind = ALT SHIFT, 9, exec, ~/.config/hypr/scripts/centerstage-focus.sh 9

# PBP/PIP Monitor Modes (for multi-input display modes)
bind = SUPER ALT, bracketleft, exec, ~/.config/hypr/scripts/centerstage-pbp.sh left
bind = SUPER ALT, bracketright, exec, ~/.config/hypr/scripts/centerstage-pbp.sh right
bind = SUPER ALT, backslash, exec, ~/.config/hypr/scripts/centerstage-pbp.sh full
bind = SUPER ALT, EQUAL, exec, ~/.config/hypr/scripts/centerstage-pip.sh tr small
bind = SUPER ALT, MINUS, exec, ~/.config/hypr/scripts/centerstage-pip.sh tr large
bind = SUPER ALT, P, exec, ~/.config/hypr/scripts/centerstage-pbp-toggle.sh

# Window opacity
bind = SUPER ALT, O, exec, ~/.config/hypr/scripts/opacity-cycle.sh

# Wallpaper
bind = SUPER ALT, W, exec, ~/.config/hypr/scripts/wallpaper-cycle.sh

# Standard DE-style bindings (overrides above where keys overlap)
bind = SUPER, RETURN, exec, uwsm-app -- alacritty
bind = SUPER, SPACE, exec, rofi -show drun
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
