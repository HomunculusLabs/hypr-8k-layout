# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Samsung Odyssey G9 57" (Dual UHD 7680x2160)
# Use stable monitor description so port renumbering on boot won't break 8K
monitor = desc:Samsung Electric Company Odyssey G95NC HNTYB00763, 7680x2160@60, 0x0, 1
# Fallback rules in case description matching changes
monitor = DP-5, 7680x2160@60, 0x0, 1
monitor = DP-4, 7680x2160@60, 0x0, 1

# Disable unused ports
monitor = DP-3, disable
monitor = HDMI-A-1, disable

# No scaling needed at native resolution on 57" display
env = GDK_SCALE,1
env = QT_SCALE_FACTOR,1

# NVIDIA optimizations
env = GBM_BACKEND,nvidia-drm
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1
env = AQ_DRM_DEVICES,/dev/dri/card1
